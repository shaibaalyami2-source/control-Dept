<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM | إدارة البلاغات والتحكم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{
 --bg:#f4f7fb;--card:#fff;--text:#142033;--muted:#66758a;--line:#e3eaf2;
 --navy:#0d2b46;--blue:#1769e0;--blue2:#2b82f6;--green:#0b8f62;--green2:#19a86f;
 --yellow:#d58a00;--red:#c83b4a;--purple:#7057d6;--shadow:0 12px 36px rgba(16,42,67,.08)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#f7f9fc 0,#eef3f8 100%);font-family:Tahoma,Arial,sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}
.shell{min-height:100vh}
.top{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#0d2b46,#123e62);color:#fff;padding:16px 3.5%;display:flex;justify-content:space-between;align-items:center;gap:18px;box-shadow:0 12px 30px rgba(13,43,70,.18)}
.brand{display:flex;align-items:center;gap:15px;min-width:0}
.brand-logo{width:62px;height:62px;background:#fff;border-radius:16px;padding:6px;object-fit:contain;flex:0 0 auto}
.brand h1{margin:0;font-size:22px;line-height:1.25}
.brand p{margin:4px 0 0;color:#d5e4f3;font-size:13px}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.live-pill{display:flex;align-items:center;gap:7px;background:#0b8f6226;border:1px solid #47d39f66;padding:8px 11px;border-radius:999px;font-size:12px;color:#dff9ee}
.live-dot{width:9px;height:9px;border-radius:50%;background:#28d88d;box-shadow:0 0 0 5px rgba(40,216,141,.13)}
.container{max-width:1650px;margin:24px auto;padding:0 18px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:.2s transform,.2s box-shadow}
.kpi:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(16,42,67,.11)}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--blue)}
.kpi.green::before{background:var(--green)}.kpi.yellow::before{background:var(--yellow)}.kpi.red::before{background:var(--red)}.kpi.purple::before{background:var(--purple)}
.kpi small{color:var(--muted);font-weight:700}.kpi strong{display:block;font-size:29px;margin-top:7px}.kpi span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.tab-btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:11px 14px;border-radius:12px;font-weight:800;box-shadow:0 4px 14px rgba(16,42,67,.04)}
.tab-btn:hover{border-color:#b7c7d8}.tab-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.grid-2{display:grid;grid-template-columns:1.4fr .9fr;gap:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.panel-head h2{margin:0;font-size:19px}.panel-head p{margin:0;color:var(--muted);font-size:12px}
.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap;background:#f7f9fc;border:1px solid var(--line);padding:13px;border-radius:14px;margin-bottom:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:#32425a}
input,select,textarea{background:#fff;border:1px solid #d7e1ec;border-radius:10px;padding:11px 12px;outline:none;color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:#77aef0;box-shadow:0 0 0 3px rgba(23,105,224,.09)}textarea{min-height:110px;resize:vertical}
.btn{border:1px solid var(--line);background:#fff;padding:10px 13px;border-radius:11px;font-weight:800}.btn:hover{background:#f7f9fc}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn-primary:hover{background:#0f5ac6}
.btn-success{background:var(--green);border-color:var(--green);color:#fff}.btn-danger{color:#a32331;border-color:#e5afb7;background:#fff8f8}
.btn-soft{background:#eef5ff;border-color:#cfe0fa;color:#145fc3}
.btn-small{padding:7px 9px;font-size:12px}
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.span-2{grid-column:span 2}.span-4{grid-column:1/-1}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:1080px;background:#fff}th,td{padding:11px;border-bottom:1px solid #ebeff4;text-align:right;vertical-align:top}th{position:sticky;top:0;background:#f7f9fc;color:#526278;font-size:12px;z-index:1}tbody tr:hover{background:#fbfdff}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;white-space:nowrap}
.status-work{background:#eaf2ff;color:#155fc2}.status-done{background:#e7f7ee;color:#0e7141}.status-pending{background:#fff4d9;color:#956100}.status-cancel{background:#fdebed;color:#a32635}
.priority-emergency{background:#fdebed;color:#a32635}.priority-urgent{background:#fff4d9;color:#956100}.priority-normal{background:#edf4ff;color:#2868bd}
.qa-ok{background:#e7f7ee;color:#0e7141}.qa-bad{background:#fdebed;color:#a32635}.qa-review{background:#fff4d9;color:#956100}
.overdue{color:#b11e2d;font-weight:900}
.empty{padding:28px;text-align:center;color:var(--muted)}
.msg{padding:11px;border-radius:10px;margin-top:10px;display:none}.msg.show{display:block}.msg.ok{background:#e9f8f1;color:#10693d}.msg.err{background:#fdebed;color:#a32635}
.shift-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.shift-card{border:1px solid var(--line);border-radius:15px;padding:14px;background:linear-gradient(180deg,#fff,#f9fbfd)}
.shift-card h3{margin:0 0 4px}.shift-time{font-size:12px;color:var(--muted)}.shift-stats{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.shift-stat{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}.shift-stat b{display:block;font-size:18px}
.bar-row{display:grid;grid-template-columns:120px 1fr 42px;gap:8px;align-items:center;margin:10px 0;font-size:12px}.bar-bg{height:10px;background:#edf1f6;border-radius:999px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));border-radius:999px}
.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.metric small{color:var(--muted)}.metric strong{display:block;font-size:23px;margin-top:6px}
.search-box{display:flex;gap:8px;margin-bottom:12px}.search-box input{flex:1}
.modal{position:fixed;inset:0;background:rgba(5,25,44,.58);display:flex;justify-content:center;align-items:center;padding:18px;z-index:100}
.modal-box{background:#fff;width:min(900px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:20px;position:relative;box-shadow:0 24px 70px rgba(0,0,0,.25)}
.modal-close{position:absolute;inset-inline-start:14px;top:11px;border:0;background:none;font-size:28px;color:#65758b}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.detail{border:1px solid var(--line);padding:10px;border-radius:11px;background:#f9fbfd}.detail small{color:var(--muted);display:block}.detail b{display:block;margin-top:3px}
.timeline{margin-top:12px;border-inline-start:3px solid #dbe7f6;padding-inline-start:14px}.event{padding:8px 0;position:relative}.event::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--blue);position:absolute;inset-inline-start:-20px;top:14px}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 20% 10%,#2a80ef55,transparent 32%),linear-gradient(135deg,#0d2b46,#1769e0)}
.login-card{width:min(470px,100%);background:#fff;border-radius:22px;padding:26px;box-shadow:0 26px 90px rgba(0,0,0,.2)}.login-brand{display:flex;gap:13px;align-items:center;margin-bottom:18px}.login-logo{width:70px;height:70px;object-fit:contain;border-radius:16px;background:#fff;border:1px solid var(--line);padding:6px}.login-card h1{margin:0;font-size:25px}.login-card p{color:var(--muted);margin:7px 0 18px}.login-form{display:grid;gap:11px}
.qr-box{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:12px}#qrCanvas img{border:8px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.print-sheet{display:none}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}.form-grid{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}.metrics-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}.form-grid,.metrics-grid,.detail-grid,.shift-grid{grid-template-columns:1fr}.span-2{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.brand h1{font-size:18px}}

/* Official A4 report */
.print-sheet{color:#102a43;background:#fff}
.print-header{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:18px;border-bottom:3px solid var(--green);padding-bottom:12px;margin-bottom:14px}
.print-logo{width:100px;height:92px;object-fit:contain;justify-self:end}.print-title{text-align:center}.print-title h1{margin:0;font-size:20px}.print-title h2{margin:4px 0 0;font-size:16px;color:var(--green)}.print-title p{margin:4px 0 0;font-size:11px;color:#66758a}
.print-side{font-size:10px;line-height:1.8;color:#5b6879}.print-side strong{color:#102a43}
.print-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.print-meta .box{border:1px solid #dce4ec;border-radius:8px;padding:7px 9px;background:#f8fafc}.print-meta small{display:block;color:#6b7888}.print-meta b{display:block;margin-top:2px}
.print-sheet table{width:100%;min-width:0;border-collapse:collapse;font-size:9.2px}.print-sheet th{position:static;background:#102a43;color:#fff;border:1px solid #d7dfe8;padding:6px}.print-sheet td{border:1px solid #d7dfe8;padding:5px}.print-footer{margin-top:12px;border-top:1px solid #dce4ec;padding-top:7px;display:flex;justify-content:space-between;font-size:9px;color:#66758a}
@media print{
 @page{size:A4 landscape;margin:10mm}
 html,body{background:#fff!important}
 #app{display:none!important}
 .print-sheet{display:block!important}
 .print-header,.print-meta,.print-footer{display:grid!important}
 .print-footer{display:flex!important}
 .print-sheet thead{display:table-header-group}
 .print-sheet tr{break-inside:avoid;page-break-inside:avoid}
}

/* V3 operations shell */
.sidebar{position:fixed;top:0;right:-330px;width:320px;height:100vh;background:var(--card);border-left:1px solid var(--line);box-shadow:-18px 0 44px rgba(0,0,0,.14);z-index:140;padding:18px;transition:right .22s ease;overflow:auto}
.sidebar.open{right:0}.sidebar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sidebar-head h3{margin:0}.side-btn{width:100%;display:flex;align-items:center;gap:10px;justify-content:flex-start;padding:12px 13px;margin:7px 0;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;font-weight:800}.side-btn:hover{background:var(--soft)}.side-group{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}.backdrop{position:fixed;inset:0;background:rgba(4,16,28,.35);z-index:130;display:none}.backdrop.show{display:block}.menu-btn{border:1px solid #ffffff40;background:#ffffff18;color:#fff;padding:10px 12px;border-radius:11px;font-weight:900}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}.seg{display:flex;background:var(--soft);padding:4px;border-radius:11px;border:1px solid var(--line);gap:4px}.seg button{border:0;background:transparent;padding:7px 9px;border-radius:8px;color:var(--text);font-weight:800}.seg button.active{background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.08)}.employee-hit{background:#eff8ff;border:1px solid #cfe3fa;border-radius:11px;padding:10px;font-size:12px;color:#1e5b93}.employee-miss{background:#fff8e8;border:1px solid #f4d38d;border-radius:11px;padding:10px;font-size:12px;color:#8a6100}.readonly{background:var(--soft)!important}.dark{--bg:#0b1220;--card:#121b2b;--text:#e8edf7;--muted:#a8b5c7;--line:#27354b;--soft:#182335;--navy:#0b2034;--blue:#4b94ff;--blue2:#72afff;--green:#2ac489;--green2:#49d49a;--yellow:#e4ad43;--red:#ff6476;--purple:#9b86ff;--shadow:0 14px 40px rgba(0,0,0,.24);background:linear-gradient(180deg,#0a111c 0,#0e1726 100%)}.dark input,.dark select,.dark textarea{background:#0f1827;color:var(--text);border-color:#304157}.dark .top{box-shadow:0 12px 30px rgba(0,0,0,.3)}.dark .btn{background:#162234;color:var(--text);border-color:#2b3a50}.dark .tab-btn{background:#162234;color:var(--text);border-color:#2b3a50}.dark .panel,.dark table,.dark .metric,.dark .shift-card,.dark .detail,.dark .filters{background:#121b2b}.dark th{background:#182437;color:#b9c6d7}.dark tbody tr:hover{background:#142033}
.emp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.employee-card{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px}.employee-card b{display:block;font-size:16px}.employee-card small{color:var(--muted)}
@media(max-width:700px){.sidebar{width:min(92vw,330px)}.emp-grid{grid-template-columns:1fr}}


.issue-search{display:grid;grid-template-columns:1fr auto;gap:7px}.issue-picker{position:relative;z-index:50;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow);margin-top:6px}.issue-option{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);text-align:right;padding:10px 12px;cursor:pointer}.issue-option:hover{background:var(--soft)}.issue-option.custom{font-weight:900}.guide-body{line-height:1.9}.guide-body h3{margin:18px 0 5px}.guide-body p{margin:0 0 8px;color:var(--muted)}.guide-body ul{margin-top:4px}.side-btn{cursor:pointer}.nav-badge{display:none;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#dc2626;color:#fff;font-size:11px;font-weight:900;margin-inline-start:auto}.notify-btn{margin-top:8px}.emp-grid .metric{padding:8px}.modal-card{max-width:720px}.modal-card h2{margin-top:0}

/* CRM UX polish */
.brand-logo,.login-logo,.print-logo{background:transparent!important;border:0!important;box-shadow:none!important;object-fit:contain}
.brand-logo{width:58px;height:58px;padding:0}.login-logo{width:86px;height:86px;padding:0}
.kpi{cursor:pointer;transition:transform .16s ease,box-shadow .16s ease}.kpi:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(0,0,0,.12)}
@media(max-width:700px){.modal{padding:0;align-items:stretch}.modal-box{width:100%;height:100%;max-height:100vh;border-radius:0;padding:16px 14px 82px;overflow:auto}.modal-box .form-grid{grid-template-columns:1fr!important;gap:10px}.modal-box .span-4{grid-column:span 1!important}.modal-actions{position:sticky;bottom:-1px;background:var(--card);padding:10px 0 0;margin:16px -2px -66px;z-index:5}.top{padding:10px 12px}.brand h1{font-size:16px}.brand p{font-size:11px}.brand-logo{width:46px;height:46px}.tabs{display:none}.container{padding:12px}.kpis{grid-template-columns:repeat(2,1fr)!important;gap:8px}.kpi{padding:12px}.kpi strong{font-size:22px}.sidebar{width:min(92vw,340px)}}
.crm-admin-grid{display:grid;grid-template-columns:1fr;gap:10px}.perm-user{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}.perm-user-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.perm-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.perm-item{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--line);border-radius:10px}.perm-item input{width:auto}@media(max-width:600px){.perm-list{grid-template-columns:1fr}}

<style>
.request-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.request-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card)}.request-status{font-weight:900}.request-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.notification-dot{display:inline-flex;min-width:20px;height:20px;padding:0 6px;align-items:center;justify-content:center;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:900;margin-inline-start:5px}.balance-box{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0}.balance-item{padding:10px;border:1px solid var(--line);border-radius:12px;background:#f8fafc}.balance-item b{display:block;font-size:18px;margin-top:3px}@media(max-width:700px){.request-grid,.balance-box{grid-template-columns:1fr}}
</style>

</head>
<body>
<div id="app"></div>
<section id="printSheet" class="print-sheet" aria-hidden="true">
  <div class="print-header">

function elapsedMinutes(r){const start=new Date(r.started_at||r.created_at).getTime(); const end=new Date(r.completed_at||nowISO()).getTime(); return Math.max(0,(end-start)/60000)}

function kpi(label,id,note,color){const tab=id==='kDone'?'tracking':id==='kWork'?'tracking':id==='kPending'?'tracking':id==='kCancel'?'reports':id==='kOverdue'?'tracking':'tracking';return `<div class="kpi ${color}" onclick="smartKpi('${id}')"><small>${label}</small><strong id="${id}">0</strong><span>${note||'مؤشر تشغيلي مباشر'}</span></div>`}
function updateDashboard(){const c=(s)=>reports.filter(r=>r.status===s).length;const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};set('kTotal',reports.length);set('kDone',c('منجز'));set('kWork',c('جاري العمل'));set('kPending',c('معلق'));set('kCancel',c('ملغى'));set('kOverdue',reports.filter(overdue).length);const live=document.getElementById('liveText2');if(live)live.textContent='Realtime'}
function smartKpi(id){const map={kTotal:'',kDone:'منجز',kWork:'جاري العمل',kPending:'معلق',kCancel:'منجز',kOverdue:'متأخر'};const st=map[id];if(id==='kCancel'){showTab('reports');const x=document.getElementById('filterStatus');if(x){x.value='ملغى';renderReportsTable()}return}showTab(st?'tracking':'control');if(st){const x=document.getElementById('trackStatus');if(x){x.value=st;renderTrackingTable()}}}

async function lookupEmployee(){const input=document.getElementById('fEmployee');if(!input)return;const n=input.value.trim();const hit=employees.find(e=>String(e.employee_no)===n);const note=document.getElementById('employeeLookup');const name=document.getElementById('fRequester'),ext=document.getElementById('fExt');if(hit){name.value=hit.full_name||'';ext.value=hit.extension||'';name.readOnly=true;ext.readOnly=true;name.classList.add('readonly');ext.classList.add('readonly');if(note)note.innerHTML=`<div class="employee-hit">✅ تم العثور على الموظف: <b>${esc(hit.full_name)}</b> · التحويلة <b>${esc(hit.extension||'—')}</b></div>`}else{name.readOnly=false;ext.readOnly=false;name.classList.remove('readonly');ext.classList.remove('readonly');if(note)note.innerHTML=n?'<div class="employee-miss">⚠️ الرقم غير موجود. أدخل الاسم والتحويلة، وسيتم حفظهما تلقائيًا في دليل الموظفين.</div>':''}}

function summaryMetric(label,value){return `<div class="metric"><small>${label}</small><strong>${value}</strong></div>`}
function renderAlertList(){const a=reports.filter(r=>isActive(r)&&(r.priority==='طوارئ'||overdue(r))).sort((x,y)=>(y.priority==='طوارئ')-(x.priority==='طوارئ')).slice(0,8);if(!a.length)return '<div class="empty">لا توجد تنبيهات حرجة الآن ✅</div>';return a.map(r=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)"><div><b>#${r.id} · ${esc(r.main_location)}</b><div style="font-size:12px;color:var(--muted);margin-top:3px">${esc(r.description)} · ${esc(r.priority)}</div></div><button class="btn btn-small" onclick="openReport(${r.id})">فتح</button></div>`).join('')}
function renderControlTable(){const box=document.getElementById('controlTable');if(!box)return;const q=(document.getElementById('controlSearch')?.value||'').toLowerCase();const rows=reports.filter(isActive).filter(r=>JSON.stringify(r).toLowerCase().includes(q));box.innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>رقم</th><th>الأولوية</th><th>الوقت</th><th>طالب الخدمة</th><th>الموقع / البلاغ</th><th>الفني</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>#${r.id}</b></td><td><span class="badge ${priorityClass(r.priority)}">${esc(r.priority)}</span></td><td class="${overdue(r)?'overdue':''}">${fmt(r.created_at)}${overdue(r)?'<br><small>متأخر عن SLA</small>':''}</td><td>${esc(r.requester)}<br><small>${esc(r.employee_no)}</small></td><td><b>${esc(r.main_location)}</b><br>${esc(r.description)}</td><td>${esc(technicians.find(t=>t.id===r.technician_id)?.name||'—')}</td><td><span class="badge ${statusClass(r.status)}">${esc(r.status)}</span></td><td><button class="btn btn-small btn-soft" onclick="openReport(${r.id})">تحديث</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد بلاغات نشطة.</div>'}
function renderIssueDatalist(){return issueOptions.map(v=>`<option value="${esc(v).replaceAll('\"','&quot;')}"></option>`).join('')}
function renderNew(){const el=document.getElementById('new');if(!el)return;el.innerHTML=`<div class="panel"><div class="panel-head"><div><h2>تسجيل بلاغ جديد</h2><p>أدخل الرقم الوظيفي فقط؛ سيجلب النظام الاسم والتحويلة تلقائيًا. وإذا لم يكن الرقم موجودًا يمكنك إدخالهما وسيتم حفظهما في الدليل.</p></div></div><form id="newForm"><div class="form-grid"><label>رقم الموظف<input id="fEmployee" required oninput="lookupEmployee()"></label><label>طالب الخدمة<input id="fRequester" required></label><label>التحويلة<input id="fExt"></label><div id="employeeLookup" class="span-4"></div><label>تاريخ البلاغ<input id="fDate" type="date"></label><label>وقت البلاغ<input id="fTime" type="time"></label><label>الموقع الرئيسي<input id="fMainLocation" required placeholder="مثال: الطوارئ"></label><label>الموقع الفرعي<input id="fSubLocation"></label><label>القسم<input id="fDept" required><span style="font-size:11px;color:var(--muted)">يمكن كتابة اسم القسم مباشرة</span></label><label>الأولوية<select id="fPriority"><option>عادي</option><option>عاجل</option><option>طوارئ</option></select></label><label>نوع البلاغ<select id="fIssueType"><option>تصحيحي</option><option>وقائي</option><option>طوارئ</option></select></label><label class="span-4">وصف المشكلة<input id="fDesc" list="issueList" required autocomplete="off" placeholder="اكتب للبحث أو اختر من القائمة، ويمكنك كتابة أي وصف يدويًا…"><datalist id="issueList">${renderIssueDatalist()}</datalist><span style="font-size:11px;color:var(--muted)">ابحث داخل العبارات الجاهزة، وإذا لم تجد المشكلة اكتبها مباشرة.</span></label></div><div class="modal-actions"><button class="btn btn-primary" type="submit">حفظ البلاغ</button><button class="btn" type="button" onclick="document.getElementById('newForm').reset();setNewDefaults()">إعادة ضبط</button></div><div id="newMsg" class="msg"></div></form></div>`;document.getElementById('newForm').onsubmit=createReport;setNewDefaults();lookupEmployee()}
function setNewDefaults(){const now=riyadhInputParts(new Date().toISOString()),d=document.getElementById('fDate'),t=document.getElementById('fTime');if(d)d.value=now.date;if(t)t.value=now.time}
function currentShiftCode(){const h=new Date().getHours();return h>=7&&h<15?'A':h>=15&&h<23?'B':'C'}
async function createReport(e){e.preventDefault();const deptName=document.getElementById('fDept').value.trim();const dept=departments.find(d=>d.name_ar===deptName)||departments.find(d=>d.name_ar.includes(deptName)||deptName.includes(d.name_ar));const d=document.getElementById('fDate').value||new Date().toISOString().slice(0,10),t=document.getElementById('fTime').value||new Date().toTimeString().slice(0,5);const created=new Date(`${d}T${t}`).toISOString();const payload={employee_no:document.getElementById('fEmployee').value.trim(),requester:document.getElementById('fRequester').value.trim(),ext:document.getElementById('fExt').value.trim()||null,created_at:created,main_location:document.getElementById('fMainLocation').value.trim(),sub_location:document.getElementById('fSubLocation').value.trim()||null,description:document.getElementById('fDesc').value.trim(),department_id:dept?.id||null,status:'جاري العمل',priority:document.getElementById('fPriority').value,issue_type:document.getElementById('fIssueType').value,started_at:nowISO(),created_by:currentUser.id};const empNo=payload.employee_no,empName=payload.requester,empExt=payload.ext;await ensureEmployee(empNo,empName,empExt);const {data,error}=await sb.from('reports').insert(payload).select('*').single();const msg=document.getElementById('newMsg');if(error){msg.className='msg show err';msg.textContent='تعذر حفظ البلاغ: '+error.message;return}await audit(data.id,'إنشاء بلاغ',null,'جاري العمل','تم تسجيل البلاغ من غرفة التحكم');msg.className='msg show ok';msg.textContent=`تم تسجيل البلاغ رقم #${data.id} بنجاح.`;document.getElementById('newForm').reset();setNewDefaults();lookupEmployee();await loadAll();showTab('control')}

function renderTracking(){const el=document.getElementById('tracking');if(!el)return;el.innerHTML=`<div class="panel"><div class="panel-head"><div><h2>متابعة وتحديث البلاغات</h2><p>هنا تستطيع إسناد الفني وتغيير الحالة وتوثيق الإجراءات.</p></div></div><div class="filters"><label>الحالة<select id="trackStatus" onchange="renderTrackingTable()"><option value="">الكل</option><option>جاري العمل</option><option>معلق</option><option>منجز</option><option>ملغى</option></select></label><label>الأولوية<select id="trackPriority" onchange="renderTrackingTable()"><option value="">كل الأولويات</option><option>طوارئ</option><option>عاجل</option><option>عادي</option></select></label></div><div id="trackingTable"></div></div>`;renderTrackingTable()}
function renderTrackingTable(){const box=document.getElementById('trackingTable');if(!box)return;const st=document.getElementById('trackStatus').value,pr=document.getElementById('trackPriority').value;const rows=reports.filter(r=>(!st||r.status===st)&&(!pr||r.priority===pr));box.innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>البلاغ</th><th>التاريخ</th><th>النوع/الأولوية</th><th>الموقع</th><th>الفني</th><th>الحالة</th><th>QA</th><th>إجراء</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>#${r.id}</b><br><small>${esc(r.requester)}</small></td><td>${fmt(r.created_at)}</td><td><span class="badge ${priorityClass(r.priority)}">${esc(r.priority)}</span><br><small>${esc(r.issue_type)}</small></td><td>${esc(r.main_location)}</td><td>${esc(technicians.find(t=>t.id===r.technician_id)?.name||'—')}</td><td><span class="badge ${statusClass(r.status)}">${esc(r.status)}</span></td><td><span class="badge ${qaClass(r.qa_status)}">${esc(r.qa_status)}</span></td><td><button class="btn btn-small btn-soft" onclick="openReport(${r.id})">فتح</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد نتائج.</div>'}
function openReport(id){const r=reports.find(x=>x.id===id);if(!r)return;const dp=riyadhInputParts(r.created_at);document.getElementById('modal').innerHTML=`<div class="modal-box"><button class="modal-close" onclick="closeModal()">×</button><div class="panel-head"><div><h2>البلاغ #${r.id}</h2><p>${fmt(r.created_at)}</p></div><span class="badge ${statusClass(r.status)}">${esc(r.status)}</span></div><div class="form-grid"><label>الرقم الوظيفي<input id="mEmployee" value="${esc(r.employee_no||'')}" readonly class="readonly"></label><label>طالب الخدمة<input id="mRequester" value="${esc(r.requester||'')}"></label><label>التحويلة<input id="mExt" value="${esc(r.ext||'')}"></label><label>تاريخ البلاغ (ميلادي)<input id="mDate" type="date" value="${dp.date}"></label><label>وقت البلاغ (بتوقيت الرياض)<input id="mTime" type="time" value="${dp.time}"></label><label>الموقع الرئيسي<input id="mMainLocation" value="${esc(r.main_location||'')}"></label><label>الموقع الفرعي<input id="mSubLocation" value="${esc(r.sub_location||'')}"></label><label>القسم المسؤول<select id="mDept"><option value="">بدون تحديد</option>${departments.map(d=>`<option value="${d.id}" ${r.responsible_department_id===d.id?'selected':''}>${esc(d.name_ar)}${d.name_en?' — '+esc(d.name_en):''}</option>`).join('')}</select></label><label>الأولوية<select id="mPriority"><option ${r.priority==='عادي'?'selected':''}>عادي</option><option ${r.priority==='عاجل'?'selected':''}>عاجل</option><option ${r.priority==='طوارئ'?'selected':''}>طوارئ</option></select></label><label>نوع البلاغ<select id="mIssueType"><option ${r.issue_type==='تصحيحي'?'selected':''}>تصحيحي</option><option ${r.issue_type==='وقائي'?'selected':''}>وقائي</option><option ${r.issue_type==='طوارئ'?'selected':''}>طوارئ</option></select></label><label>الحالة<select id="mStatus"><option ${r.status==='جاري العمل'?'selected':''}>جاري العمل</option><option ${r.status==='منجز'?'selected':''}>منجز</option><option ${r.status==='معلق'?'selected':''}>معلق</option><option ${r.status==='ملغى'?'selected':''}>ملغى</option></select></label><label>الفني<select id="mTech"><option value="">بدون إسناد</option>${technicians.map(t=>`<option value="${t.id}" ${r.technician_id===t.id?'selected':''}>${esc(t.name)}${t.employee_no?' — '+esc(t.employee_no):''}</option>`).join('')}</select></label><label class="span-4">وصف المشكلة / العطل<input id="mDesc" list="mIssueList" value="${esc(r.description||'')}" autocomplete="off" placeholder="اختر أو اكتب وصفًا يدويًا"><datalist id="mIssueList">${renderIssueDatalist()}</datalist></label><label class="span-4">حالة QA<select id="mQA"><option ${r.qa_status==='غير مراجع'?'selected':''}>غير مراجع</option><option ${r.qa_status==='مقبول'?'selected':''}>مقبول</option><option ${r.qa_status==='مرفوض'?'selected':''}>مرفوض</option></select></label><label class="span-4">ملاحظة QA<textarea id="mQANote" placeholder="ملاحظات المراجعة…">${esc(r.qa_note||'')}</textarea></label></div><div class="modal-actions"><button class="btn btn-primary" onclick="saveReport(${r.id})">حفظ التعديل</button><button class="btn" onclick="showHistory(${r.id})">سجل التدقيق</button><button class="btn" onclick="showQR(${r.id})">QR</button><button class="btn btn-success" onclick="printSingle(${r.id})">طباعة البلاغ</button></div><div id="modalMsg" class="msg"></div><div id="historyBox"></div><div id="qrBox"></div></div>`;document.getElementById('modal').classList.remove('hidden')}
async function saveReport(id){if(!can('edit_report')){toast('ليس لديك صلاحية تعديل البلاغ',false);return}const r=reports.find(x=>x.id===id);if(!r)return;const status=document.getElementById('mStatus').value,tech=document.getElementById('mTech').value?Number(document.getElementById('mTech').value):null,dept=document.getElementById('mDept').value?Number(document.getElementById('mDept').value):null,priority=document.getElementById('mPriority').value,issueType=document.getElementById('mIssueType').value,qa=document.getElementById('mQA').value,qaNote=document.getElementById('mQANote').value.trim()||null,date=document.getElementById('mDate').value,time=document.getElementById('mTime').value;if(!date||!time){document.getElementById('modalMsg').className='msg show err';document.getElementById('modalMsg').textContent='التاريخ والوقت مطلوبان.';return}let patch={requester:document.getElementById('mRequester').value.trim(),ext:document.getElementById('mExt').value.trim()||null,created_at:riyadhDateTimeToISO(date,time),main_location:document.getElementById('mMainLocation').value.trim(),sub_location:document.getElementById('mSubLocation').value.trim()||null,description:document.getElementById('mDesc').value.trim(),status,technician_id:tech,responsible_department_id:dept,priority,issue_type:issueType,qa_status:qa,qa_note:qaNote,updated_at:nowISO()};if(tech && !r.assigned_at)patch.assigned_at=nowISO();if(status==='جاري العمل'&&!r.started_at)patch.started_at=nowISO();if(status==='منجز'&&r.status!=='منجز'){patch.completed_at=nowISO();patch.closed_at=nowISO()}else if(status!=='منجز'&&r.status==='منجز'){patch.completed_at=null;patch.closed_at=null}if(qa!=='غير مراجع'){patch.qa_reviewed_at=nowISO();patch.qa_reviewed_by=currentUser.id}else if(qa==='غير مراجع'){patch.qa_reviewed_at=null;patch.qa_reviewed_by=null}const {data,error}=await sb.from('reports').update(patch).eq('id',id).select('*').single();if(error){document.getElementById('modalMsg').className='msg show err';document.getElementById('modalMsg').textContent='تعذر التحديث: '+error.message;return}await audit(id,'تعديل بيانات البلاغ',r.status,data.status,'تم تعديل معلومات الطالب والموقع والتاريخ/الوقت ووصف المشكلة وحالة التشغيل');toast('تم حفظ تعديلات البلاغ');await loadAll();openReport(id)}
async function showHistory(id){const box=document.getElementById('historyBox');box.innerHTML='<div class="empty">تحميل السجل…</div>';const {data,error}=await sb.from('report_audit_logs').select('*').eq('report_id',id).order('created_at',{ascending:false});if(error){box.innerHTML='<div class="msg show err">'+esc(error.message)+'</div>';return}box.innerHTML=data?.length?`<div style="margin-top:14px"><b>سجل التدقيق</b><div class="timeline">${data.map(e=>`<div class="event"><b>${esc(e.action)}</b> · ${fmt(e.created_at)}<div style="font-size:12px;color:var(--muted)">${esc(e.note||'')}${e.from_status?' · '+esc(e.from_status)+' → '+esc(e.to_status||''):''}</div></div>`).join('')}</div></div>`:'<div class="empty">لا يوجد سجل حتى الآن.</div>'}
function showQR(id){const box=document.getElementById('qrBox');box.innerHTML='<div class="qr-box"><div id="qrCanvas"></div><div><b>QR البلاغ #'+id+'</b><div style="font-size:12px;color:var(--muted);margin-top:5px">امسح الرمز للوصول إلى مرجع البلاغ.</div></div></div>';new QRCode(document.getElementById('qrCanvas'),{text:`CONTROL-DEPT|${id}`,width:128,height:128,correctLevel:QRCode.CorrectLevel.M})}
function printSingle(id){const r=reports.find(x=>x.id===id);if(!r)return;preparePrint([r]);window.print()}
function preparePrint(rows){document.getElementById('pPeriod').textContent=rows.length===1?'بلاغ محدد':`${document.getElementById('fromDate')?.value||'—'} إلى ${document.getElementById('toDate')?.value||'—'}`;document.getElementById('pStatus').textContent=document.getElementById('filterStatus')?.value||'الكل';document.getElementById('pCount').textContent=rows.length;document.getElementById('pGenerated').textContent=fmt(nowISO());document.getElementById('printBody').innerHTML=rows.length?rows.map(r=>`<tr><td>${r.id}</td><td>${fmt(r.created_at)}</td><td>${fmt(r.closed_at)}</td><td>${esc(r.requester)}<br><small>${esc(r.employee_no)}</small></td><td>${esc([r.main_location,r.sub_location].filter(Boolean).join(' / '))}</td><td>${esc(r.priority)}</td><td>${esc(r.issue_type)}</td><td>${esc(r.status)}</td><td>${esc(technicians.find(t=>t.id===r.technician_id)?.name||'—')}</td><td>${esc(departments.find(d=>d.id===r.responsible_department_id)?.name_ar||departments.find(d=>d.id===r.department_id)?.name_ar||'—')}</td><td>${esc(r.description)}</td></tr>`).join(''):'<tr><td colspan="11" style="text-align:center;padding:20px">لا توجد نتائج</td></tr>'}
function filteredReports(){const f=document.getElementById('fromDate')?.value||'',t=document.getElementById('toDate')?.value||'',s=document.getElementById('filterStatus')?.value||'',p=document.getElementById('filterPriority')?.value||'';return reports.filter(r=>{const base=(s==='منجزة حسب الإغلاق'||s==='منجز')?r.closed_at||r.created_at:r.created_at;const d=base.slice(0,10);return(!f||d>=f)&&(!t||d<=t)&&(!s||s==='منجزة حسب الإغلاق'&&r.status==='منجز'||s==='منجز'&&r.status==='منجز'||(s!=='منجزة حسب الإغلاق'&&s!=='منجز'&&r.status===s))&&(!p||r.priority===p)})}
function renderReports(){const el=document.getElementById('reports');if(!el)return;el.innerHTML=`<div class="panel"><div class="panel-head"><div><h2>التقارير والطباعة</h2><p>التقارير الزمنية تعتمد على وقت الإغلاق الفعلي عند تحليل الإنجاز.</p></div></div><div class="filters"><label>من تاريخ<input id="fromDate" type="date"></label><label>إلى تاريخ<input id="toDate" type="date"></label><label>الحالة<select id="filterStatus"><option value="">الكل</option><option>جاري العمل</option><option>معلق</option><option>منجز</option><option>ملغى</option><option value="منجزة حسب الإغلاق">منجزة حسب الإغلاق</option></select></label><label>الأولوية<select id="filterPriority"><option value="">الكل</option><option>طوارئ</option><option>عاجل</option><option>عادي</option></select></label><button class="btn btn-primary" onclick="renderReportsTable()">تطبيق</button><button class="btn btn-soft" onclick="exportCSV()">📥 CSV</button><button class="btn btn-success" onclick="printReports()">🖨 طباعة رسمية</button></div><div id="reportTable"></div></div>`;renderReportsTable()}
function renderReportsTable(){const box=document.getElementById('reportTable');if(!box)return;const rows=filteredReports();box.innerHTML=`<div class="metrics-grid" style="margin-bottom:12px">${summaryMetric('النتائج',rows.length)}${summaryMetric('منجز',rows.filter(r=>r.status==='منجز').length)}${summaryMetric('متأخر',rows.filter(overdue).length)}${summaryMetric('مقبول QA',rows.filter(r=>r.qa_status==='مقبول').length)}</div><div class="table-wrap"><table><thead><tr><th>رقم</th><th>الإنشاء</th><th>الإغلاق الفعلي</th><th>طالب الخدمة</th><th>الموقع</th><th>الأولوية</th><th>الحالة</th><th>QA</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>#${r.id}</td><td>${fmt(r.created_at)}</td><td>${fmt(r.closed_at)}</td><td>${esc(r.requester)}</td><td>${esc(r.main_location)}</td><td>${esc(r.priority)}</td><td>${esc(r.status)}</td><td>${esc(r.qa_status)}</td></tr>`).join(''):'<tr><td colspan="8" class="empty">لا توجد نتائج مطابقة</td></tr>'}</tbody></table></div>`}
function printReports(){const rows=filteredReports();preparePrint(rows);window.print()}
function exportCSV(){const rows=filteredReports();const head=['رقم البلاغ','وقت الإنشاء','وقت الإغلاق الفعلي','طالب الخدمة','رقم الموظف','الموقع الرئيسي','الموقع الفرعي','الأولوية','نوع البلاغ','الحالة','الفني','القسم','حالة QA','الوصف'];const lines=[head,...rows.map(r=>[r.id,r.created_at,r.closed_at,r.requester,r.employee_no,r.main_location,r.sub_location,r.priority,r.issue_type,r.status,technicians.find(t=>t.id===r.technician_id)?.name||'',departments.find(d=>d.id===r.responsible_department_id)?.name_ar||departments.find(d=>d.id===r.department_id)?.name_ar||'',r.qa_status,r.description])].map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(','));const blob=new Blob(['\\ufeff'+lines.join('\\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='control-dept-reports.csv';a.click();URL.revokeObjectURL(a.href)}
function renderShifts(){const el=document.getElementById('shifts');if(!el)return;const today=new Date().toISOString().slice(0,10);el.innerHTML=`<div class="panel"><div class="panel-head"><div><h2>إدارة الورديات والأداء</h2><p>مؤشرات الوردية مبنية على البلاغات المسجلة اليوم.</p></div></div><div class="shift-grid">${(shifts.length?shifts:[{code:'A',name_ar:'الوردية A',start_time:'07:00',end_time:'15:00'},{code:'B',name_ar:'الوردية B',start_time:'15:00',end_time:'23:00'},{code:'C',name_ar:'الوردية C',start_time:'23:00',end_time:'07:00'}]).map(s=>{const rs=reports.filter(r=>r.shift_code===s.code&&r.created_at.slice(0,10)===today);const done=rs.filter(r=>r.status==='منجز').length;const active=rs.filter(isActive).length;const overdueN=rs.filter(overdue).length;return `<div class="shift-card"><h3>${esc(s.name_ar)} <span class="badge badge-blue">${s.code}</span></h3><div class="shift-time">${s.start_time||'—'} – ${s.end_time||'—'}</div><div class="shift-stats"><div class="shift-stat"><small>بلاغات</small><b>${rs.length}</b></div><div class="shift-stat"><small>منجزة</small><b>${done}</b></div><div class="shift-stat"><small>نشطة</small><b>${active}</b></div><div class="shift-stat"><small>متأخرة</small><b class="${overdueN?'overdue':''}">${overdueN}</b></div></div></div>`}).join('')}</div></div>`}
function renderQA(){const el=document.getElementById('qa');if(!el)return;const completed=reports.filter(r=>r.status==='منجز'&&r.closed_at);const total=reports.length;const completion=total?Math.round(completed.length/total*100):0;const avgResolve=completed.length?completed.reduce((a,r)=>a+elapsedMinutes(r),0)/completed.length:null;const accepted=reports.filter(r=>r.qa_status==='مقبول').length;const rejected=reports.filter(r=>r.qa_status==='مرفوض').length;const topSite=countBy(reports.map(r=>r.main_location).filter(Boolean))[0]?.[0]||'—';const topIssue=countBy(reports.map(r=>r.issue_type).filter(Boolean))[0]?.[0]||'—';el.innerHTML=`<div class="panel"><div class="panel-head"><div><h2>الجودة وضمانها (QA)</h2><p>الإنجاز يحسب باستخدام وقت الإغلاق الفعلي.</p></div></div><div class="metrics-grid"><div class="metric"><small>نسبة الإنجاز</small><strong>${completion}%</strong></div><div class="metric"><small>متوسط زمن الإنجاز</small><strong>${fmtMin(avgResolve)}</strong></div><div class="metric"><small>مقبول QA</small><strong>${accepted}</strong></div><div class="metric"><small>مرفوض QA</small><strong>${rejected}</strong></div></div></div><div class="grid-2"><div class="panel"><div class="panel-head"><div><h2>توزيع الحالات</h2></div></div>${barHtml(countBy(reports.map(r=>r.status)))}</div><div class="panel"><div class="panel-head"><div><h2>أكثر المواقع والبلاغات</h2></div></div><div class="metrics-grid"><div class="metric"><small>أكثر موقع</small><strong style="font-size:17px">${esc(topSite)}</strong></div><div class="metric"><small>أكثر وصف تكرارًا</small><strong style="font-size:17px">${esc(topIssue).slice(0,35)}</strong></div></div></div></div>`}
function countBy(arr){const m={};arr.forEach(v=>m[v]=(m[v]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function barHtml(items){if(!items.length)return '<div class="empty">لا توجد بيانات</div>';const max=items[0][1]||1;return items.slice(0,8).map(([k,v])=>`<div class="bar-row"><span>${esc(k)}</span><div class="bar-bg"><div class="bar-fill" style="width:${Math.max(4,v/max*100)}%"></div></div><b>${v}</b></div>`).join('')}

async function refreshSocial(){
  const [p,m,n,rset,lr,lb,nt]=await Promise.all([
    sb.from('profiles').select('id,full_name,role,active').eq('active',true).order('full_name'),
    sb.from('internal_messages').select('id,sender_id,recipient_id,message,created_at,read_at,archived_at').or(`sender_id.eq.${currentUser.id},recipient_id.eq.${currentUser.id},recipient_id.is.null`).order('created_at',{ascending:false}).limit(120),
    isAdmin()?sb.from('employee_notes').select('*').order('created_at',{ascending:false}).limit(120):sb.from('employee_notes').select('*').eq('employee_id',currentUser.id).order('created_at',{ascending:false}).limit(60),
    isAdmin()?sb.from('system_retention_settings').select('*').order('record_type'):Promise.resolve({data:[],error:null}),
    sb.from('leave_requests').select('id,requester_id,leave_type,start_date,end_date,days,note,status,reviewed_at,reviewer_note,created_at').or(isAdmin()?`requester_id.eq.${currentUser.id},status.eq.pending`:`requester_id.eq.${currentUser.id}`).order('created_at',{ascending:false}).limit(100),
    isAdmin()?sb.from('leave_balances').select('user_id,leave_type,allocated_days,used_days,reserved_days'):sb.from('leave_balances').select('user_id,leave_type,allocated_days,used_days,reserved_days').eq('user_id',currentUser.id),
    sb.from('notifications').select('id,type,title,body,entity_type,entity_id,read_at,created_at').eq('user_id',currentUser.id).order('created_at',{ascending:false}).limit(50)
  ]);
  colleagueProfiles=p.data||[]; internalMessages=m.data||[]; employeeNotes=n.data||[]; retentionSettings=rset.data||[];
  leaveRequests=lr.data||[]; leaveBalances=lb.data||[]; notifications=nt.data||[];
  unreadMessageCount=internalMessages.filter(x=>x.recipient_id===currentUser.id && !x.read_at).length;
  unreadNoteCount=isAdmin()?employeeNotes.filter(x=>!x.acknowledged_at).length:0;
  updateNotificationBadges();
}
function updateNotificationBadges(){
  document.querySelectorAll('[data-badge="messages"]').forEach(b=>{b.textContent=unreadMessageCount>0?unreadMessageCount:'';b.style.display=unreadMessageCount>0?'inline-flex':'none';});
  document.querySelectorAll('[data-badge="notes"]').forEach(b=>{b.textContent=unreadNoteCount>0?unreadNoteCount:'';b.style.display=unreadNoteCount>0?'inline-flex':'none';});
  const unreadNotices=notifications.filter(x=>!x.read_at).length;
  document.querySelectorAll('[data-badge="notifications"]').forEach(b=>{b.textContent=unreadNotices>0?unreadNotices:'';b.style.display=unreadNotices>0?'inline-flex':'none';});
  document.querySelectorAll('[data-badge="requests"]').forEach(b=>{const n=isAdmin()?leaveRequests.filter(x=>x.status==='pending').length:leaveRequests.filter(x=>x.status==='pending').length;b.textContent=n>0?n:'';b.style.display=n>0?'inline-flex':'none';});
}

  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));

const LEAVE_TYPES={annual:'سنوية',eid_adha:'عيد الأضحى',national_day:'اليوم الوطني',founding_day:'يوم التأسيس',other:'أخرى'};
function leaveTypeLabel(v){return LEAVE_TYPES[v]||v||'—'}
function leaveStatusLabel(v){return v==='pending'?'معلّق':v==='approved'?'معتمد':v==='rejected'?'مرفوض':'ملغي'}
function leaveStatusClass(v){return v==='approved'?'status-done':v==='rejected'||v==='cancelled'?'status-cancel':'status-pending'}
function leaveBalanceFor(type){return leaveBalances.find(x=>x.leave_type===type)||{allocated_days:0,used_days:0,reserved_days:0}}
async function submitLeave(){
  const type=document.getElementById('leaveType').value,start=document.getElementById('leaveStart').value,end=document.getElementById('leaveEnd').value,note=document.getElementById('leaveNote').value.trim(),msg=document.getElementById('leaveMsg');
  if(!start||!end){msg.className='msg show err';msg.textContent='حدد تاريخ البداية والنهاية.';return}
  const btn=document.getElementById('leaveSubmit');btn.disabled=true;btn.textContent='جاري التحقق والإرسال…';
  const {data,error}=await sb.rpc('submit_leave_request',{p_leave_type:type,p_start_date:start,p_end_date:end,p_note:note||null});
  btn.disabled=false;btn.textContent='إرسال الطلب';
  if(error){msg.className='msg show err';msg.textContent=error.message.replace(/^.*?: /,'');return}
  msg.className='msg show ok';msg.textContent=`تم إرسال الطلب #${data?.id||''} وهو الآن معلّق لحين اعتماد رئيس القسم.`;
  document.getElementById('leaveForm').reset();await refreshSocial();renderRequests();
}
async function reviewLeave(id,status){
  const note=status==='rejected'?prompt('سبب الرفض (اختياري):')||'':prompt('ملاحظة الاعتماد (اختيارية):')||'';
  const {error}=await sb.rpc('review_leave_request',{p_request_id:id,p_status:status,p_note:note});
  if(error){toast(error.message);return}
  toast(status==='approved'?'تم اعتماد الطلب وتحديث الرصيد':'تم رفض الطلب وإطلاق الرصيد المحجوز');await refreshSocial();renderRequests();
}
async function saveLeaveBalance(uid,type){
  const input=document.getElementById(`bal_${uid}_${type}`);if(!input)return;
  const {error}=await sb.rpc('set_leave_balance',{p_user_id:uid,p_leave_type:type,p_allocated_days:Number(input.value)||0});
  if(error){toast(error.message);return}
  toast('تم تحديث الرصيد');await refreshSocial();renderRequests();
}
async function markNotificationsRead(){
  const unread=notifications.filter(x=>!x.read_at).map(x=>x.id);if(!unread.length)return;
  await sb.from('notifications').update({read_at:nowISO()}).in('id',unread);await refreshSocial();renderRequests();
}
function renderRequests(){
  const el=document.getElementById('requests');if(!el)return;
  const my=leaveRequests.filter(x=>x.requester_id===currentUser.id);

function bindIssuePicker(){
 const input=document.getElementById('fDesc'),box=document.getElementById('issuePicker'); if(!input||!box)return;

}
function renderIssuePicker(q=''){
 const box=document.getElementById('issuePicker'); if(!box)return;
 const low=q.trim().toLowerCase(); visibleIssueOptions=issueOptions.filter(x=>!low||x.toLowerCase().includes(low)).slice(0,80);
 let html=visibleIssueOptions.map((x,i)=>`<button type="button" class="issue-option" data-index="${i}">${esc(x)}</button>`).join('');
 if(low && !issueOptions.some(x=>x.toLowerCase()===low)) html+=`<button type="button" class="issue-option custom" data-custom="${esc(q.trim())}">✍️ استخدام النص: ${esc(q.trim())}</button>`;
 box.innerHTML=html||'<div class="empty">لا توجد مطابقة — اكتب وصفك يدويًا.</div>'; box.classList.remove('hidden');
}

function renderGuide(){
 const el=document.getElementById('guide');if(!el)return;const adminSections=isAdmin()?'<h3>رئيس القسم</h3><ul><li>متابعة أداء جميع المشرفين.</li><li>مراجعة QA والملاحظات والتنبيهات.</li><li>إدارة الاحتفاظ بالسجلات.</li><li>إدارة المستخدمين والصلاحيات.</li><li>التقارير والطباعة وسجل التدقيق.</li></ul>':'<h3>المشرف</h3><ul><li>فتح ومتابعة البلاغات.</li><li>التواصل الداخلي.</li><li>رفع ملاحظة أو تنبيه لرئيس القسم.</li><li>متابعة إنجازاته الشخصية.</li><li>استخدام QA المسموح له.</li></ul>';
 el.innerHTML=`<div class="panel"><div class="panel-head"><div><h2>📘 دليل النظام</h2><p>دليل مخصص حسب صلاحيتك الحالية: ${esc(roleLabel())}</p></div></div><input id="guideSearch" placeholder="ابحث داخل الدليل…" oninput="filterGuide()"><div id="guideBody" class="guide-body"><h3>فتح بلاغ</h3><p>أدخل الرقم الوظيفي. إذا كان موجودًا يظهر الاسم والتحويلة تلقائيًا. إذا لم يكن موجودًا، أدخل البيانات وستُحفظ في دليل الموظفين.</p><h3>وصف المشكلة</h3><p>استخدم قائمة البحث في وصف المشكلة، أو اكتب وصفًا يدويًا عند عدم وجوده.</p><h3>التواصل الداخلي</h3><p>الرسائل الداخلية منفصلة عن سجل البلاغات وتظهر فقط للمستخدمين المعنيين.</p><h3>الملاحظات والتنبيهات</h3><p>يرفع المشرف ملاحظة أو تنبيه لرئيس القسم، ويستطيع الرئيس تسجيل حالة المراجعة.</p><h3>QA</h3><p>مراجعة جودة البلاغات المنجزة، قبولها أو إعادتها للمراجعة.</p>${adminSections}<h3>الإعدادات</h3><p>تغيير كلمة المرور واللغة والمظهر، ورئيس القسم يستطيع إدارة مدد الاحتفاظ والأرشفة.</p></div></div>`
}
function filterGuide(){const q=document.getElementById('guideSearch').value.toLowerCase();document.querySelectorAll('#guideBody h3,#guideBody p,#guideBody li').forEach(el=>el.style.display=!q||el.textContent.toLowerCase().includes(q)?'':'none')}
function openPasswordModal(){openModal(`<div class="modal-card"><button class="modal-close" onclick="closeModal()">×</button><h2>🔐 تغيير كلمة المرور</h2><label>كلمة المرور الجديدة<input id="pw1" type="password"></label><label>تأكيد كلمة المرور<input id="pw2" type="password"></label><div class="modal-actions"><button class="btn btn-primary" onclick="changePassword()">حفظ</button></div><div id="pwMsg" class="msg"></div></div>`)}
async function changePassword(){const a=document.getElementById('pw1').value,b=document.getElementById('pw2').value,m=document.getElementById('pwMsg');if(a.length<8||a!==b){m.className='msg show err';m.textContent='تأكد من تطابق كلمة المرور وأنها 8 أحرف على الأقل.';return}const {error}=await sb.auth.updateUser({password:a});m.className=`msg show ${error?'err':'ok'}`;m.textContent=error?error.message:'تم تغيير كلمة المرور بنجاح.';if(!error)setTimeout(closeModal,800)}
function openAppearanceModal(){openModal(`<div class="modal-card"><button class="modal-close" onclick="closeModal()">×</button><h2>🎨 إعدادات العرض</h2><div class="settings-row"><b>اللغة</b><div class="seg"><button onclick="applyLanguage('ar');closeModal()">العربية</button><button onclick="applyLanguage('en');closeModal()">English</button></div></div><div class="settings-row"><b>المظهر</b><div class="seg"><button onclick="applyTheme('light');closeModal()">☀️ نهاري</button><button onclick="applyTheme('dark');closeModal()">🌙 ليلي</button></div></div></div>`)}
function openRetentionModal(){renderSettings();showTab('settings');closeSidebar()}
async function saveRetention(){for(const r of ['reports','messages','notes','alerts']){const v=Number(document.getElementById('ret_'+r).value)||12;await sb.from('system_retention_settings').upsert({record_type:r,retention_months:v,archive_only:true,updated_at:nowISO(),updated_by:currentUser.id},{onConflict:'record_type'})}await refreshSocial();toast('تم حفظ مدد الاحتفاظ')}
const PERMISSIONS=[['create_report','إنشاء البلاغات'],['edit_report','تعديل البلاغات'],['change_status','تغيير حالة البلاغ'],['assign_technician','إسناد الفني'],['change_department','تغيير القسم المسؤول'],['view_reports','مشاهدة التقارير والبلاغات'],['view_audit','مشاهدة سجل التدقيق'],['use_qa','إدارة QA'],['use_messages','التواصل الداخلي'],['view_employees','دليل الموظفين'],['send_notes','إرسال ملاحظات لرئيس القسم'],['view_performance','مشاهدة أداء الموظفين'],['manage_users','إدارة المستخدمين والصلاحيات'],['manage_settings','إدارة إعدادات النظام']];
let myPermissions=new Set();
async function loadPermissions(){if(isAdmin()){myPermissions=new Set(PERMISSIONS.map(x=>x[0]));return}const {data}=await sb.from('user_permissions').select('permission').eq('user_id',currentUser.id).eq('enabled',true);myPermissions=new Set((data||[]).map(x=>x.permission))}
function can(p){return isAdmin()||myPermissions.has(p)}
function applyPermissionsUI(){document.querySelectorAll('[data-perm]').forEach(el=>{const p=el.dataset.perm;if(p&&!can(p))el.style.display='none'});if(!isAdmin()){document.querySelectorAll('[data-tab="performance"],[data-tab="settings"]').forEach(x=>x.style.display='none')}}
async function openPermissionsModal(){if(!isAdmin())return;const {data:users}=await sb.from('profiles').select('id,full_name,role,active').eq('active',true).order('full_name');const {data:rows}=await sb.from('user_permissions').select('user_id,permission,enabled');const by={};(rows||[]).forEach(x=>(by[x.user_id]??=[]).push(x.permission));openModal(`<div class="modal-box"><button class="modal-close" onclick="closeModal()">×</button><h2>👑 إدارة المستخدمين والصلاحيات</h2><p>اختر المستخدم ثم امنحه فقط الصلاحيات التي يحتاجها.</p><div class="crm-admin-grid">${(users||[]).filter(u=>u.role!=='admin').map(u=>`<div class="perm-user"><div class="perm-user-head"><div><b>${esc(u.full_name)}</b><div style="font-size:12px;color:var(--muted)">مشرف قسم البلاغات</div></div><button class="btn btn-primary" onclick="saveUserPermissions('${u.id}')">حفظ</button></div><div class="perm-list">${PERMISSIONS.map(([k,l])=>`<label class="perm-item"><input type="checkbox" data-user="${u.id}" data-perm-key="${k}" ${(by[u.id]||[]).includes(k)?'checked':''}> <span>${l}</span></label>`).join('')}</div></div>`).join('')}</div></div>`)}
async function saveUserPermissions(userId){const checks=[...document.querySelectorAll(`[data-user="${userId}"]`)];await sb.from('user_permissions').delete().eq('user_id',userId);const rows=checks.filter(x=>x.checked).map(x=>({user_id:userId,permission:x.dataset.permKey,enabled:true}));if(rows.length){const {error}=await sb.from('user_permissions').insert(rows);if(error){toast('تعذر حفظ الصلاحيات',false);return}}toast('تم حفظ صلاحيات المستخدم')}
function renderSettings(){
 const el=document.getElementById('settings');if(!el)return;if(!isAdmin()){el.innerHTML=`<div class="panel"><h2>⚙️ الإعدادات</h2><div class="settings-row"><b>تغيير كلمة المرور</b><button class="btn" onclick="openPasswordModal()">فتح</button></div><div class="settings-row"><b>إعدادات العرض</b><button class="btn" onclick="openAppearanceModal()">فتح</button></div></div>`;return}
 const map={reports:'سجل البلاغات',messages:'الرسائل الداخلية',notes:'ملاحظات الموظفين',alerts:'تنبيهات الموظفين'};const vals=Object.fromEntries(retentionSettings.map(x=>[x.record_type,x.retention_months]));
 el.innerHTML=`<div class="grid-2"><div class="panel"><h2>⚙️ الإدارة</h2><div class="settings-row"><b>المستخدمون والصلاحيات</b><button class="btn btn-primary" onclick="openPermissionsModal()">إدارة الصلاحيات</button></div><div class="settings-row"><b>تهيئة المشرفين</b><button class="btn" onclick="showSupervisorSetup()">فتح</button></div><div class="settings-row"><b>تغيير كلمة المرور</b><button class="btn" onclick="openPasswordModal()">فتح</button></div><div class="settings-row"><b>إعدادات العرض</b><button class="btn" onclick="openAppearanceModal()">فتح</button></div></div><div class="panel"><h2>🗄️ الاحتفاظ بالسجلات</h2>${Object.entries(map).map(([k,v])=>`<label>${v}<input id="ret_${k}" type="number" min="1" max="240" value="${vals[k]||12}"> <small>شهر</small></label>`).join('')}<div class="modal-actions"><button class="btn btn-primary" onclick="saveRetention()">حفظ مدد الاحتفاظ</button></div><p style="font-size:12px;color:var(--muted)">تُؤرشف السجلات بدل الحذف النهائي.</p></div></div>`
}
function showSupervisorSetup(){openModal(`<div class="modal-card"><button class="modal-close" onclick="closeModal()">×</button><h2>تهيئة حسابات المشرفين</h2><p>الحسابات المطلوبة:</p><ul>${SUPERVISOR_DEFINITIONS.map(x=>`<li>${x.name} — ${x.email}</li>`).join('')}</ul><p><b>كلمة المرور المؤقتة:</b> ********</p><p style="font-size:12px;color:var(--muted)">إنشاء حسابات Auth من لوحة Supabase هو خطوة إدارية منفصلة. بعد إنشاء الحسابات بنفس البريد، سيظهرون هنا تلقائيًا بصلاحية مشرف.</p><div class="modal-actions"><button class="btn" onclick="closeModal()">إغلاق</button></div></div>`)}
async function syncEmployeeSeed(){
 if(!isAdmin())return toast('استيراد دليل الموظفين متاح لرئيس القسم فقط.');
 const btn=document.getElementById('seedBtn');if(btn)btn.disabled=true;toast('جارٍ مزامنة دليل الموظفين…');
 for(let i=0;i<EMPLOYEE_SEED.length;i+=200){const part=EMPLOYEE_SEED.slice(i,i+200).map(([employee_no,full_name,extension])=>({employee_no,full_name,extension:extension||null,active:true}));const {error}=await sb.from('employee_directory').upsert(part,{onConflict:'employee_no'});if(error){toast(error.message);break}}
 await loadAll();if(btn)btn.disabled=false;toast('تمت مزامنة دليل الموظفين')}
function renderEmployees(){
 const el=document.getElementById('employees');if(!el)return;const rows=employees.slice().sort((a,b)=>String(a.employee_no).localeCompare(String(b.employee_no),undefined,{numeric:true}));
 el.innerHTML=`<div class="panel"><div class="panel-head"><div><h2>👥 دليل الموظفين</h2><p>الحقول: الرقم الوظيفي، الاسم، التحويلة.</p></div><div class="modal-actions">${isAdmin()?'<button id="seedBtn" class="btn btn-primary" onclick="syncEmployeeSeed()">مزامنة ملف الموظفين</button>':''}</div></div><div class="search-box" style="margin-bottom:12px"><input id="empSearch" placeholder="بحث بالرقم أو الاسم أو التحويلة…" oninput="renderEmployeeTable()"></div><div id="empTable"></div></div>`;renderEmployeeTable()}
function renderEmployeeTable(){const box=document.getElementById('empTable');if(!box)return;const q=(document.getElementById('empSearch')?.value||'').toLowerCase();const rows=employees.filter(e=>!q||[e.employee_no,e.full_name,e.extension].some(v=>String(v||'').toLowerCase().includes(q))).slice(0,300);box.innerHTML=`<div class="table-wrap"><table><thead><tr><th>الرقم الوظيفي</th><th>الاسم</th><th>التحويلة</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${esc(e.employee_no)}</td><td>${esc(e.full_name)}</td><td>${esc(e.extension||'')}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">لا توجد نتائج</td></tr>'}</tbody></table></div><div style="margin-top:8px;font-size:12px;color:var(--muted)">إجمالي ظاهر: ${rows.length} من ${employees.length}</div>`}
function setupRealtime(){
 try{
  if(rtChannel)sb.removeChannel(rtChannel);
  rtChannel=sb.channel('control-dept-live')
   .on('postgres_changes',{event:'*',schema:'public',table:'reports'},async()=>{const {data}=await sb.from('reports').select('*').order('created_at',{ascending:false});reports=data||[];updateDashboard();if(document.getElementById('control')&&!document.getElementById('control').classList.contains('hidden'))renderControl();if(document.getElementById('tracking')&&!document.getElementById('tracking').classList.contains('hidden'))renderTracking();})
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'internal_messages'},async(payload)=>{
     const row=payload.new||{};
     if(row.recipient_id===currentUser.id || row.recipient_id===null || row.sender_id===currentUser.id){
       await refreshSocial();
       if(row.sender_id!==currentUser.id)notifyIncoming('رسالة جديدة',row.message||'لديك رسالة داخلية جديدة');
       if(document.getElementById('messages')&&!document.getElementById('messages').classList.contains('hidden'))renderMessages();
     }
   })
   .on('postgres_changes',{event:'*',schema:'public',table:'employee_notes'},async(payload)=>{
     const row=payload.new||{};
     if((isAdmin() && payload.eventType==='INSERT') || row.employee_id===currentUser.id){
       await refreshSocial();
       if(isAdmin() && payload.eventType==='INSERT')notifyIncoming('ملاحظة/تنبيه جديد لرئيس القسم',row.subject||row.body||'لديك تنبيه جديد');
       if(document.getElementById('notes')&&!document.getElementById('notes').classList.contains('hidden'))renderNotes();
     }
   })
   .subscribe();
 }catch(e){console.warn(e)}
}
async function start(){
 const {data:{session}}=await sb.auth.getSession();
 if(session){currentUser=session.user;const {data:profile,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(error||!profile){renderLogin();return}currentProfile=profile;renderShell();await loadAll();setupRealtime();showTab('control')}else renderLogin();
}

start();
</script>
